<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إدارة سجلات الطلاب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Exo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root { /* Dark Theme */
        --bg-primary: #0A0F1A;
        --bg-secondary: #1A202C;
        --bg-glass: rgba(18, 24, 38, 0.7);
        --text-primary: #E2E8F0;
        --text-secondary: #A0AEC0;
        --accent-primary: #38BDF8;   /* light blue */
        --accent-secondary: #34D399; /* green */
        --accent-danger: #F87171;    /* red */
        --accent-info: #A78BFA;      /* violet */
        --border-color: rgba(60, 100, 150, 0.2);
        --glow-primary: 0 0 8px var(--accent-primary), 0 0 16px var(--accent-primary);
        --glow-secondary: 0 0 8px var(--accent-secondary), 0 0 16px var(--accent-secondary);
        --glow-danger: 0 0 8px var(--accent-danger), 0 0 16px var(--accent-danger);
        --glow-info: 0 0 8px var(--accent-info), 0 0 16px var(--accent-info);

        --soft-bg-primary: rgba(56, 189, 248, 0.1);
        --soft-bg-secondary: rgba(52, 211, 153, 0.1);
        --soft-bg-danger: rgba(248, 113, 113, 0.1);
        --soft-bg-info: rgba(167, 139, 250, 0.1);

        --text-accent-primary: #7DD3FC;
        --text-accent-secondary: #6EE7B7;
        --text-accent-danger: #FCA5A5;
        --text-accent-info: #C4B5FD;

        /* Semantic Tokens */
        --card-bg: rgba(26, 32, 44, 0.6);
        --input-bg: rgba(0, 0, 0, 0.3);
        --badge-bg: rgba(255, 255, 255, 0.08);
        --hover-bg: rgba(255, 255, 255, 0.05);
        --border-subtle: rgba(255, 255, 255, 0.05);
        --tab-inactive-bg: rgba(0, 0, 0, 0.25);
        --radial-glow-1: rgba(56, 189, 248, 0.1);
        --radial-glow-2: rgba(52, 211, 153, 0.1);
      }
      
      html.light { /* Light Theme */
        --bg-primary: #F8FAFC;
        --bg-secondary: #FFFFFF;
        --bg-glass: rgba(255, 255, 255, 0.85);
        --text-primary: #0F172A;     /* slate-900 (highly accessible contrast) */
        --text-secondary: #475569;   /* slate-600 */
        --accent-primary: #0284C7;   /* sky-600 */
        --accent-secondary: #059669; /* emerald-600 */
        --accent-danger: #DC2626;    /* red-600 */
        --accent-info: #7C3AED;      /* violet-600 */
        --border-color: #E2E8F0;
        --glow-primary: 0 4px 12px rgba(2, 132, 199, 0.15);
        --glow-secondary: 0 4px 12px rgba(5, 150, 105, 0.15);
        --glow-danger: 0 4px 12px rgba(220, 38, 38, 0.15);
        --glow-info: 0 4px 12px rgba(124, 58, 237, 0.15);

        --soft-bg-primary: rgba(2, 132, 199, 0.08);
        --soft-bg-secondary: rgba(5, 150, 105, 0.08);
        --soft-bg-danger: rgba(220, 38, 38, 0.08);
        --soft-bg-info: rgba(124, 58, 237, 0.08);
        
        --text-accent-primary: #0284C7;
        --text-accent-secondary: #059669;
        --text-accent-danger: #DC2626;
        --text-accent-info: #7C3AED;

        /* Semantic Tokens */
        --card-bg: rgba(255, 255, 255, 0.95);
        --input-bg: #F1F5F9;
        --badge-bg: #E2E8F0;
        --hover-bg: #F1F5F9;
        --border-subtle: #E2E8F0;
        --tab-inactive-bg: #E2E8F0;
        --radial-glow-1: rgba(2, 132, 199, 0.04);
        --radial-glow-2: rgba(5, 150, 105, 0.04);
      }

      body {
        font-family: 'Exo 2', 'Cairo', sans-serif;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        transition: background-color 0.3s ease, color 0.3s ease;
        background-image: 
          radial-gradient(circle at 15% 50%, var(--radial-glow-1), transparent 30%),
          radial-gradient(circle at 85% 30%, var(--radial-glow-2), transparent 30%);
      }

      @keyframes fade-in-down {
        from {
          opacity: 0;
          transform: translateY(-15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes background-pan {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      
      @keyframes draw-stroke {
        from { stroke-dashoffset: 283; }
        to { stroke-dashoffset: 0; }
      }

      @keyframes grow-width {
        from { width: 0%; }
        to { width: var(--target-width, 0%); }
      }

      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }

      @keyframes pulse {
        0%, 100% {
          opacity: 0.7;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.05);
        }
      }

      .animate-fade-in-down {
        animation: fade-in-down 0.6s ease-out forwards;
        opacity: 0;
      }

      .bg-animated-gradient {
        background-image: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary), var(--accent-primary));
        background-size: 200% 200%;
        animation: background-pan 3s linear infinite;
      }

      .login-grid-background {
        background-image:
          linear-gradient(var(--border-color) 1px, transparent 1px),
          linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
        background-size: 40px 40px;
        background-position: center;
      }
    </style>

</head>
  <body class="bg-[var(--bg-primary)]">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
